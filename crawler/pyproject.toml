[project]
name = "gsi-crawler"
version = "0.1.0"
description = "Crawler and indexer for chat.gsi.de"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "psycopg[binary]>=3.2",
    "valkey>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
