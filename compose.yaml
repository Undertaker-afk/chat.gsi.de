name: chat-gsi-de

services:
  db:
    image: docker.io/pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmbot}
      POSTGRES_USER: ${POSTGRES_USER:-llmbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:z,ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmbot} -d ${POSTGRES_DB:-llmbot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_PORT: 8081
      KC_HEALTH_ENABLED: "true"
      # The issuer in the discovery document. It must be reachable under the SAME
      # URL from the browser and from inside the frontend container, or OIDC
      # issuer validation fails. `keycloak.localhost` satisfies both: the host
      # resolves *.localhost to 127.0.0.1 (where the port below is published), and
      # inside the compose network the alias resolves to this container.
      KC_HOSTNAME: http://keycloak.localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      # Dev box has ~1.5 GB free; keep the JVM small. See plan.md §3.
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
    volumes:
      - ./deploy/keycloak/realm-gsi.json:/opt/keycloak/data/import/realm-gsi.json:z,ro
    networks:
      default:
        aliases: [keycloak.localhost]
    ports:
      - "127.0.0.1:8081:8081"   # 8080 is taken by the Znuny test instance (info.md)
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    environment:
      # --- GSI LLM proxy. Paths verified 2026-07-27; note /api/v1, not /v1. ---
      LLM_BASE_URL: ${LLM_BASE_URL:-http://192.168.50.1:8080/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      CHAT_MODEL: ${CHAT_MODEL:-llmbot.mistral-small-4-119b}
      UTILITY_MODEL: ${UTILITY_MODEL:-llmbot.gpt-oss-120b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-200000}
      DATABASE_URL: postgres://${POSTGRES_USER:-llmbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-llmbot}
      VALKEY_URL: redis://valkey:6379
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak.localhost:8081/realms/gsi}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-chat-gsi-de}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/auth/callback}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # adapter-node needs the public origin to build correct URLs and to accept
      # form posts; without it SvelteKit infers it from the Host header.
      ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      MAX_ROUNDS: ${MAX_ROUNDS:-3}
      MAX_SUBAGENTS_PER_ROUND: ${MAX_SUBAGENTS_PER_ROUND:-4}
      DEEP_WALL_CLOCK_BUDGET_S: ${DEEP_WALL_CLOCK_BUDGET_S:-180}
      RETRIEVE_TOP_K: ${RETRIEVE_TOP_K:-40}
      CONTEXT_CHUNKS_FAST: ${CONTEXT_CHUNKS_FAST:-8}
      CONTEXT_CHUNKS_DEEP: ${CONTEXT_CHUNKS_DEEP:-12}
      UPLOAD_QUOTA_BYTES: ${UPLOAD_QUOTA_BYTES:-1073741824}
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-10485760}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweed-s3:8333}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-gsi-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_LINK_TTL_SECONDS: ${S3_LINK_TTL_SECONDS:-300}
      # --- metrics (one registry, one /metrics endpoint) -------------------
      # The frontend is the ONLY scrape target: it collects from the master and
      # every volume server at scrape time. S3_CAPACITY_BYTES is the planned
      # capacity the storage gauge is drawn against, not a measurement.
      S3_MASTER_URL: ${S3_MASTER_URL:-http://seaweed-master:9333}
      S3_CAPACITY_BYTES: ${S3_CAPACITY_BYTES:-27487790694400}
      KEYCLOAK_MANAGEMENT_URL: ${KEYCLOAK_MANAGEMENT_URL:-http://keycloak:9000}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_CACHE_SECONDS: ${METRICS_CACHE_SECONDS:-15}
      METRICS_TIMEOUT_SECONDS: ${METRICS_TIMEOUT_SECONDS:-5}
      APP_VERSION: ${APP_VERSION:-dev}
      # One JSON object per line on stdout; Promtail ships it to Loki verbatim.
      # LOG_FORMAT=text is for `npm run dev` in a terminal, not for a container.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Read-only directory lookups for the admin user picker (plan.md 8b).
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak.localhost:8081}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gsi}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      REVOCATION_GRACE_DAYS: ${REVOCATION_GRACE_DAYS:-30}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db: {condition: service_healthy}
      valkey: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      seaweed-s3: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # --- object storage -------------------------------------------------------
  # SeaweedFS, split into its real roles so storage can be SHARDED: the master
  # assigns writes across volume servers, so `podman compose up -d --scale
  # seaweed-volume=3` adds capacity and spreads data with no application change.
  # The S3 gateway keeps the API portable -- swapping in AWS S3 or MinIO later is
  # an endpoint change, not a rewrite.
  seaweed-master:
    image: docker.io/chrislusf/seaweedfs:latest
    command: ["master", "-ip=seaweed-master", "-ip.bind=0.0.0.0", "-volumeSizeLimitMB=256"]
    volumes:
      - seaweed-master:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  seaweed-volume:
    image: docker.io/chrislusf/seaweedfs:latest
    # No fixed -ip: each replica registers under its own container address, which
    # is what makes `--scale seaweed-volume=N` work.
    command: ["volume", "-mserver=seaweed-master:9333", "-ip.bind=0.0.0.0", "-port=8080", "-max=0", "-dir=/data"]
    volumes:
      - seaweed-volume:/data
    depends_on:
      seaweed-master: {condition: service_healthy}
    restart: unless-stopped

  seaweed-filer:
    image: docker.io/chrislusf/seaweedfs:latest
    command: ["filer", "-master=seaweed-master:9333", "-ip.bind=0.0.0.0"]
    volumes:
      - seaweed-filer:/data
    depends_on:
      seaweed-master: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  seaweed-s3:
    image: docker.io/chrislusf/seaweedfs:latest
    command: ["s3", "-filer=seaweed-filer:8888", "-ip.bind=0.0.0.0", "-port=8333", "-config=/etc/seaweedfs/s3.json"]
    volumes:
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:z,ro
    ports:
      # Published because the browser is redirected here for direct downloads.
      - "127.0.0.1:8333:8333"
    depends_on:
      seaweed-filer: {condition: service_healthy}
    healthcheck:
      # /healthz, not /: the root is an S3 ListBuckets call, which correctly
      # answers 403 to an unsigned request and would mark the service unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # --- observability --------------------------------------------------------
  # One scrape target, one dashboard stack. The frontend's /metrics already
  # aggregates Postgres, SeaweedFS, Valkey, Keycloak and the crawler's run
  # history (frontend/src/lib/server/metrics/collectors.ts), so there are no
  # exporter sidecars here and nothing to add when a backend moves.
  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days at a 15s interval over ~200 series is a few hundred MB. The dev
      # box has ~1.5 GB free (plan.md §3), so this is the knob to turn first if
      # disk gets tight.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:z,ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:z,ro
      - prometheus-data:/prometheus
    ports:
      # Published for ad-hoc PromQL. Grafana reaches it over the compose network.
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      frontend: {condition: service_started}
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.5.1
    environment:
      # Grafana builds its OAuth redirect from this, so it must be the URL the
      # BROWSER uses and it must match a redirectUri on the `grafana` client in
      # realm-gsi.json. Same class of invariant as OIDC_ISSUER for the app.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_SERVER_HTTP_PORT: "3001"

      # --- access control: llmbot-admin only ------------------------------
      # Two mechanisms, both required:
      #   ROLE_ATTRIBUTE_PATH maps the realm role llmbot-admin to Grafana's Admin
      #   ROLE_ATTRIBUTE_STRICT refuses the login outright when that path yields
      #     nothing -- without it, an authenticated non-admin would silently get
      #     the AUTO_ASSIGN_ORG_ROLE and be able to read every dashboard.
      # `roles` is a flat claim put into the ID token and userinfo by a protocol
      # mapper on the client; Keycloak's own realm_access.roles is access-token
      # only and awkward to reach from JMESPath.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: GSI Login
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:?set GRAFANA_OIDC_CLIENT_SECRET in .env}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile roles
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${KEYCLOAK_BASE_URL:-http://keycloak.localhost:8081}/realms/${KEYCLOAK_REALM:-gsi}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${KEYCLOAK_BASE_URL:-http://keycloak.localhost:8081}/realms/${KEYCLOAK_REALM:-gsi}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${KEYCLOAK_BASE_URL:-http://keycloak.localhost:8081}/realms/${KEYCLOAK_REALM:-gsi}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: ${KEYCLOAK_BASE_URL:-http://keycloak.localhost:8081}/realms/${KEYCLOAK_REALM:-gsi}/protocol/openid-connect/logout
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(roles[*], 'llmbot-admin') && 'Admin'
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      # The local username/password form is off: leaving it on would be a way
      # into these dashboards that does not go through Keycloak at all, which
      # defeats the point of the two settings above. RECOVERY: if Keycloak is
      # broken and you need in, set GF_AUTH_DISABLE_LOGIN_FORM=false and log in
      # as admin with GRAFANA_ADMIN_PASSWORD.
      GF_AUTH_DISABLE_LOGIN_FORM: "${GRAFANA_DISABLE_LOGIN_FORM:-true}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"

      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # The dashboard the "chat.gsi.de" folder opens on.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:z,ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:z,ro
      - grafana-data:/var/lib/grafana
    networks:
      default:
        # So the browser's issuer host resolves to this network too, exactly as
        # it does for the frontend. Without it the token exchange fails while
        # the login page works -- the failure mode from AGENTS.md §6.
        aliases: [grafana.localhost]
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      prometheus: {condition: service_healthy}
      loki: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # --- logs -----------------------------------------------------------------
  # Loki stores them, Promtail ships them. See deploy/promtail/promtail-compose.yaml
  # for why the compose side of this is best-effort while the k8s side is not.
  loki:
    image: docker.io/grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:z,ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  promtail:
    image: docker.io/grafana/promtail:3.3.2
    command: ["-config.file=/etc/promtail/promtail-compose.yaml"]
    volumes:
      - ./deploy/promtail/promtail-compose.yaml:/etc/promtail/promtail-compose.yaml:z,ro
      # The host journal, where rootful podman writes container output. Read-only
      # and required: without /etc/machine-id the journal reader cannot resolve
      # which machine's logs it is looking at and silently returns nothing.
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - promtail-positions:/tmp
    depends_on:
      loki: {condition: service_healthy}
    restart: unless-stopped

  # --- status page ----------------------------------------------------------
  # Deliberately INDEPENDENT of everything above: its own network, its own
  # volumes, no depends_on, no shared database. A status page that fails with the
  # thing it reports on is worse than none at all -- the one moment anybody reads
  # it is the moment the stack is broken. Nothing here starts, stops or blocks
  # any other service.
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:1
    volumes:
      - kuma-data:/app/data
    networks: [status]
    ports:
      # uptime.lab points here. 3001 is Grafana's, 3002 is free.
      - "127.0.0.1:3002:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # The AI agent. Reads Kuma's SQLite read-only, writes incident narratives with
  # the LLM proxy, and serves the public status page. It joins `default` as well
  # as `status` purely so it CAN reach Prometheus for extra context -- that is
  # best-effort and it works fine without it (see app/prom.py).
  statuspage:
    build:
      context: ./statuspage
      dockerfile: Containerfile
    environment:
      KUMA_DB: /kuma/kuma.db
      STATUS_DB: /data/status.db
      PORT: "3003"
      # Optional context. Unreachable Prometheus degrades to "no extra signals".
      PROMETHEUS_URL: ${STATUS_PROMETHEUS_URL:-http://prometheus:9090}
      PROMETHEUS_ENABLED: ${STATUS_PROMETHEUS_ENABLED:-true}
      # The narrator. Without a key the agent still runs and publishes
      # deterministic summaries -- it never silently stops reporting.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://192.168.50.1:8080/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      STATUS_MODEL: ${STATUS_MODEL:-${UTILITY_MODEL:-llmbot.gpt-oss-120b}}
      STATUS_AI_ENABLED: ${STATUS_AI_ENABLED:-true}
      STATUS_POLL_SECONDS: ${STATUS_POLL_SECONDS:-30}
      # Only used to create the default monitors on first run. Reads always go
      # through the read-only database mount.
      KUMA_URL: ${KUMA_URL:-http://uptime-kuma:3001}
      KUMA_API_KEY: ${KUMA_API_KEY:-}
      KUMA_ADMIN_USER: ${KUMA_ADMIN_USER:-}
      KUMA_ADMIN_PASSWORD: ${KUMA_ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Read-only, and SQLite enforces it too (opened with mode=ro). This process
      # cannot corrupt Kuma's database even with a bug.
      - kuma-data:/kuma:ro
      - status-data:/data
    networks: [status, default]
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      # Answers "is the status page alive", NOT "is the stack healthy" -- a
      # status page that reports itself unhealthy during an outage would be
      # restarted exactly when it is needed.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:3003/healthz',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Batch job, not a service. Run via `make crawl` or the systemd timer in deploy/.
  crawler:
    build:
      context: ./crawler
      dockerfile: Containerfile
    profiles: ["tools"]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://192.168.50.1:8080/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      CRAWL_MODEL: ${CRAWL_MODEL:-llmbot.qwen3.6-27b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-32}
      DATABASE_URL: postgres://${POSTGRES_USER:-llmbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-llmbot}
      VALKEY_URL: redis://valkey:6379
      CRAWL_RATE_LIMIT_RPS: ${CRAWL_RATE_LIMIT_RPS:-0.2}
      CRAWL_USER_AGENT: ${CRAWL_USER_AGENT:-gsi-llmbot-crawler/1.0 (+https://chat.gsi.de)}
      CRAWL_VISION_ENABLED: ${CRAWL_VISION_ENABLED:-true}
      CRAWL_LLM_EXTRACTION: ${CRAWL_LLM_EXTRACTION:-true}
      CORPUS_DIR: /data/corpus
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data/corpus:/data/corpus:z
    depends_on:
      db: {condition: service_healthy}

networks:
  # The default network is implicit; `status` exists so Uptime Kuma shares no
  # network with the stack it watches. It reaches the monitored services the same
  # way a user does -- over the host -- which is the point: a check that passes
  # only from inside the compose network proves nothing about whether anyone can
  # actually reach the app.
  default:
  status:

volumes:
  db-data:
  seaweed-master:
  seaweed-volume:
  seaweed-filer:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:
  kuma-data:
  status-data:
