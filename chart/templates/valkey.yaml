apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels: {{- include "chat-gsi.componentLabels" (dict "ctx" . "component" "valkey") | nindent 4 }}
spec:
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels: {{- include "chat-gsi.componentLabels" (dict "ctx" . "component" "valkey") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels: {{- include "chat-gsi.componentLabels" (dict "ctx" . "component" "valkey") | nindent 8 }}
    spec:
      {{- include "chat-gsi.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          # Persistence off entirely — this is a cache.
          args: ["valkey-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources: {{- toYaml .Values.valkey.resources | nindent 12 }}
