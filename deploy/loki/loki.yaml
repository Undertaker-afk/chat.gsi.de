# Loki, single-binary, filesystem-backed.
#
# Sized for a laptop, not a cluster: one process, local disk, no object store,
# no ring beyond the in-memory one. That is the correct shape here — the whole
# stack is one node (AGENTS.md §1), and a microservices Loki would cost more RAM
# than the application it observes.
#
# The design rule that matters for anyone adding a scrape job: LABELS ARE THE
# INDEX, and every distinct combination of them is a separate stream on disk.
# Labels stay bounded (app, namespace, pod, level) and everything else —
# urls, ids, durations — lives in the JSON line body, which Loki does not index
# and Grafana parses at query time with `| json`. Putting a user id or a URL in
# a label is how a small Loki becomes an unusable one.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Log lines about logging are rarely the interesting ones.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  metric_aggregation_enabled: true
  # 31 days. Long enough to answer "was this happening last month too?", short
  # enough that the local-path PVC does not quietly eat the node's disk — which
  # on k3s is the same filesystem every other PVC lives on (§7).
  retention_period: 744h
  # The crawler logs a line per indexed page and a full wiki crawl is thousands
  # of pages; the default 4 MB/s burst is generous enough, but the per-stream
  # rate limit is what would actually drop them.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  # Pods and containers restart; a rejected out-of-order push shows up as a
  # confusing gap rather than an error anybody sees.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 5000
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  # Retention is only actually enforced when the compactor is told to do it.
  # Without these three lines retention_period above is decoration and the disk
  # grows forever.
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false

# Not a cluster; skip the deprecation nagging about it.
frontend:
  encoding: protobuf
