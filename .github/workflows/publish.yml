# Build the three app images and package the Helm chart, then push all of them to
# the GitHub Container Registry (ghcr.io). This is what makes the chart deployable
# from a real registry — Flux (or `helm install`) pulls the chart, the cluster
# pulls the images, all from ghcr.io/<owner>.
#
# Published on every push to main (tagged :dev) and on a v* tag (tagged with the
# semver). Nothing here needs a PAT: the built-in GITHUB_TOKEN can write packages.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only rebuild when something that ends up in an artifact changes.
    paths:
      - "chart/**"
      - "frontend/**"
      - "crawler/**"
      - "statuspage/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# One publish per ref at a time; a newer push cancels an in-flight run.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, crawler, statuspage]
    steps:
      - uses: actions/checkout@v4

      # ghcr repository paths must be lowercase; the owner may not be.
      - name: Resolve owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/chat-gsi-${{ matrix.component }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the Actions cache so unchanged images publish fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    # The chart references the images, so publish it after they exist.
    needs: images
    steps:
      - uses: actions/checkout@v4

      - name: Resolve owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v4

      - name: Package and push chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm package chart -d /tmp
          chart_tgz=$(ls /tmp/chat-gsi-*.tgz)
          helm push "$chart_tgz" "oci://$REGISTRY/$OWNER/charts"
          echo "pushed oci://$REGISTRY/$OWNER/charts/chat-gsi" >> "$GITHUB_STEP_SUMMARY"
