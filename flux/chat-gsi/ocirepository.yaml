# The chart, pulled from ghcr.io (published by .github/workflows/publish.yml).
#
# ghcr is HTTPS and this package is public, so no `insecure` and no `secretRef`.
# If the package is private, add a docker-registry secret with a read:packages
# PAT and reference it here via `secretRef: { name: ghcr-auth }`.
# Alternatives: the lab registry (oci://192.168.50.112:5000/charts/chat-gsi with
# insecure: true) or ttl.sh (python3 helm_push.py, tag "6h").
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: chat-gsi
  namespace: chat-gsi-flux
spec:
  interval: 5m
  url: oci://ghcr.io/undertaker-afk/charts/chat-gsi
  # Extract the Helm chart layer from the OCI artifact.
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "0.1.0"
