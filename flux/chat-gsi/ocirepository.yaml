# The chart, pulled from the lab's OCI registry.
#
# insecure: true because the registry is plain HTTP (192.168.50.112:5000, the
# same one the node pulls images from). To deliver from ttl.sh instead, run
# `python3 helm_push.py` and change url to oci://ttl.sh/<repo>/chat-gsi and the
# ref tag to "6h" (ttl.sh is public, so drop `insecure`).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: chat-gsi
  namespace: chat-gsi-flux
spec:
  interval: 5m
  url: oci://192.168.50.112:5000/charts/chat-gsi
  insecure: true
  # Extract the Helm chart layer from the OCI artifact.
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "0.1.0"
