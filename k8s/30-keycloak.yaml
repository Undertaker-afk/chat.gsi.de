---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: chat-gsi
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 80
      targetPort: 8081
    - name: management
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: chat-gsi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: chat-gsi-env
                  key: KEYCLOAK_ADMIN
                  optional: true
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-gsi-env
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HTTP_PORT
              value: "8081"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # The issuer in the discovery document. It must be reachable under
            # the SAME URL from the browser and from inside the frontend pod,
            # or OIDC issuer validation fails. `keycloak.lab` satisfies both:
            # /etc/hosts on the dev machine points it at the node, and the
            # frontend pod gets a hostAlias doing the same (see 40-frontend).
            - name: KC_HOSTNAME
              value: http://keycloak.lab
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "false"
            # Proxied by Traefik, so trust the forwarded headers.
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: JAVA_OPTS_KC_HEAP
              value: "-Xms256m -Xmx512m"
          ports:
            - containerPort: 8081
            - containerPort: 9000
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 40
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: chat-gsi
spec:
  ingressClassName: traefik
  rules:
    - host: keycloak.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
