# The scheduler tick.
#
# This CronJob is deliberately dumb: it runs `crawler tick` every five minutes,
# and `tick` asks the DATABASE what is actually due. That is what makes the crawl
# interval a value an admin sets in the UI (crawl_control.interval_minutes,
# migration 018) rather than a schedule baked into this file — changing "weekly"
# to "daily" is a dropdown, not a `kubectl apply`.
#
# Each tick does three things in order: reap runs whose crawler died, claim
# queued admin requests, then start any source whose interval has come round.
# With an empty queue and nothing due it exits in well under a second, which is
# the normal case for 287 of every 288 daily runs.
#
# The corpus volume is declared here, in the file `make deploy` applies, because
# the CronJob below cannot schedule a single pod without it. It is also mounted
# by the manual Job in 50-crawler-job.yaml, which deploy does NOT apply -- and
# while the claim lived there instead, a fresh cluster produced a CronJob whose
# every pod stayed Pending and, under Forbid, silently blocked all later ticks.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: corpus
  namespace: chat-gsi
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
# The tick dispatches a Job per crawl, so it needs to create Jobs and to read the
# CronJob it clones them from. Nothing else: no secrets, no pods, no deletes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crawler
  namespace: chat-gsi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crawler-dispatch
  namespace: chat-gsi
rules:
  # `get` on cronjobs is how a dispatched crawl inherits the image, env, volumes
  # and resources of the tick itself, instead of a second copy of that spec here
  # that would silently drift.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crawler-dispatch
  namespace: chat-gsi
subjects:
  - kind: ServiceAccount
    name: crawler
    namespace: chat-gsi
roleRef:
  kind: Role
  name: crawler-dispatch
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crawler-tick
  namespace: chat-gsi
spec:
  schedule: "*/5 * * * *"
  # Forbid is still right, but it now guards something that finishes in under a
  # second: the tick reaps, claims and dispatches, and the crawling happens in
  # the Jobs it starts (crawler/app/dispatch.py).
  #
  # While the tick crawled inline this policy was actively harmful. A first full
  # crawl of www ran for three hours; for all three hours every tick was refused
  # with JobAlreadyActive, so no queued admin request could be claimed, while
  # `kubectl get cronjob` showed a healthy schedule. Two crawls of one source are
  # still prevented -- by the SQL claim in claim_crawl_requests() and by
  # due_schedules() skipping sources with a run already running, which is where
  # that guarantee belongs.
  concurrencyPolicy: Forbid
  # A node that was asleep should not wake up and replay every missed tick.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Long enough for a full wiki crawl claimed from the queue. Beyond this the
      # Job is killed and its run is left `running`; the NEXT tick reaps it (see
      # stale_running_runs), which is why that reaper exists.
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: crawler
        spec:
          restartPolicy: Never
          # Inherited by every dispatched crawl Job, since they are clones of
          # this template -- which is why they can dispatch nothing themselves
          # and do not need to.
          serviceAccountName: crawler
          containers:
            - name: crawler
              image: 192.168.50.112:5000/chat-gsi-crawler:dev
              imagePullPolicy: Always
              args: ["tick"]
              envFrom:
                - secretRef:
                    name: chat-gsi-env
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: chat-gsi-env
                      key: POSTGRES_PASSWORD
                - name: DATABASE_URL
                  value: postgres://llmbot:$(POSTGRES_PASSWORD)@db:5432/llmbot
                - name: VALKEY_URL
                  value: redis://valkey:6379
                - name: CORPUS_DIR
                  value: /data/corpus
                # JSON on stdout, so Promtail ships it to Loki with the same
                # shape as the frontend's lines.
                - name: LOG_FORMAT
                  value: json
              volumeMounts:
                - name: corpus
                  mountPath: /data/corpus
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
          volumes:
            - name: corpus
              persistentVolumeClaim:
                claimName: corpus
