---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: chat-gsi
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: chat-gsi
spec:
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: chat-gsi
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so two pods can
  # never mount it at once and a rolling update would deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: docker.io/pgvector/pgvector:pg17
          env:
            - name: POSTGRES_DB
              value: llmbot
            - name: POSTGRES_USER
              value: llmbot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-gsi-env
                  key: POSTGRES_PASSWORD
            # Keep the cluster in a subdirectory. The volume root may contain
            # entries initdb refuses to run against; a subdir is always clean.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: migrations
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "llmbot", "-d", "llmbot"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "llmbot", "-d", "llmbot"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
        - name: migrations
          configMap:
            name: db-migrations
