# A disposable target the status-page drill drives through slow / dead / rollout.
#
# NOT part of `make -f k8s/Makefile.k8s deploy`. It exists only for the duration of
# `make -f k8s/Makefile.k8s status-drill`, which applies it, exercises it, and
# deletes it again. Nothing real depends on it and it carries no data.
#
# The point is to test the incident pipeline with REAL signal: Kuma genuinely
# observes this target being slow or offline, the agent genuinely classifies it,
# and the writer genuinely narrates it -- rather than injecting fake heartbeats.
#
# Two things are controllable and independent, which is what lets the drill tell
# an outage apart from a maintenance:
#
#   * the MONITORED path  "/"       -> ok | slow | dead   (what Kuma checks)
#   * the READINESS path  "/ready"  -> ok | notready      (what Kubernetes checks)
#
# An outage is "/" failing while the pod stays Ready (no rollout -> classify:
# outage). A maintenance is a real rollout that never becomes Ready (kube.py sees
# the rollout -> classify: maintenance). Keeping the two paths separate is the only
# way one target can produce both without one masquerading as the other.
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-drill-target
  namespace: chat-gsi
data:
  server.py: |
    """A target with a switchable health, for the status-page drill.

    Runtime state is read from files under /state (an emptyDir the drill writes
    with `kubectl exec`), falling back to the DRILL_MODE / DRILL_READY env vars.
    The env-var fallback is what makes a rollout meaningful: a fresh pod has an
    empty /state, so `kubectl set env DRILL_MODE=dead DRILL_READY=notready`
    brings up a new pod that is down AND never Ready -- a sustained, observable
    rollout the agent can catch on any poll.
    """
    import http.server
    import os
    import time

    STATE = "/state"

    def _read(name, default):
        try:
            with open(os.path.join(STATE, name), encoding="utf-8") as fh:
                return fh.read().strip()
        except OSError:
            return default

    class Handler(http.server.BaseHTTPRequestHandler):
        def _reply(self, code, body):
            payload = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/plain; charset=utf-8")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):  # noqa: N802
            path = self.path.split("?")[0].rstrip("/") or "/"
            if path == "/ready":
                ready = _read("ready", os.environ.get("DRILL_READY", "ok"))
                return self._reply(200 if ready == "ok" else 503, ready)
            # The monitored path.
            mode = _read("mode", os.environ.get("DRILL_MODE", "ok")).split()
            name = mode[0] if mode else "ok"
            if name == "dead":
                return self._reply(503, "drill: dead")
            if name == "slow":
                delay_ms = float(mode[1]) if len(mode) > 1 else 800.0
                time.sleep(delay_ms / 1000.0)
                return self._reply(200, f"drill: slow {delay_ms:.0f}ms")
            return self._reply(200, "drill: ok")

        def log_message(self, *_):  # quiet
            pass

    http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-drill-target
  namespace: chat-gsi
  labels:
    app: status-drill-target
spec:
  replicas: 1
  # Recreate, not RollingUpdate. On the maintenance phase the new pod is brought
  # up deliberately never-Ready; with RollingUpdate the old Ready pod would keep
  # serving beside it and the monitor would never see the target go down. Recreate
  # kills the old pod first, so there is a real down window during the rollout --
  # which is exactly the "down AND deploying" state the maintenance path detects.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: status-drill-target
  template:
    metadata:
      labels:
        app: status-drill-target
    spec:
      containers:
        - name: target
          image: docker.io/library/python:3.12-alpine
          command: ["python", "/app/server.py"]
          env:
            # Defaults a fresh pod comes up with. The drill overrides the running
            # pod via /state files for slow/dead (no rollout), and via `set env`
            # for the maintenance phase (a real rollout that stays not-Ready).
            - name: DRILL_MODE
              value: "ok"
            - name: DRILL_READY
              value: "ok"
          ports:
            - containerPort: 8080
              name: http
          # Readiness is the /ready path, independent of the monitored "/" path.
          # This is what separates outage from maintenance: "/" can fail while the
          # pod stays Ready (outage), or the pod can be never-Ready (maintenance).
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: state
              mountPath: /app
            - name: run
              mountPath: /state
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: state
          configMap:
            name: status-drill-target
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: status-drill-target
  namespace: chat-gsi
spec:
  selector:
    app: status-drill-target
  ports:
    - name: http
      port: 8080
      targetPort: 8080
