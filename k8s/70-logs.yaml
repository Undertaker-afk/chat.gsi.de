# Loki and Promtail.
#
# Loki is a single binary on a local-path PVC; Promtail is a DaemonSet that
# tails the node's container logs and pushes them in. Both are sized for one
# laptop-class node — see deploy/loki/loki.yaml for why that is the right shape
# here rather than a compromise.
#
# Promtail needs to LIST pods cluster-wide to discover what to tail, so it gets a
# ClusterRole. That is read-only and covers pods/nodes/services only; its scrape
# config then narrows to the chat-gsi namespace, so the permission is broader
# than the use by exactly one API verb. On an isolated lab subnet that is the
# ordinary trade (AGENTS.md §1); tightening it to a namespaced Role would mean
# giving up node-level discovery and hard-coding paths.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: chat-gsi
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # 31 days of retention for this volume of logs. The compactor enforces it;
      # without `retention_enabled` in loki.yaml this would fill instead.
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: chat-gsi
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: chat-gsi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        # The image runs as uid 10001; local-path provisions root-owned
        # directories, so without fsGroup the TSDB cannot be created and the pod
        # CrashLoopBackOffs with a bare "permission denied".
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: loki
          image: docker.io/grafana/loki:3.3.2
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            # Loki reports not-ready for ~15s after start while it joins its own
            # single-member ring. A short delay here just produces noise.
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: chat-gsi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: chat-gsi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: chat-gsi
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      # /var/log/pods is root-owned and the log files are 0644 root:root, so
      # this one has to run as root to read them. It is the standard Promtail
      # deployment and the container does nothing else.
      securityContext:
        runAsUser: 0
      containers:
        - name: promtail
          image: docker.io/grafana/promtail:3.3.2
          args:
            - -config.file=/etc/promtail/promtail-k8s.yaml
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 9080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            # containerd stores the real log files here and /var/log/pods is a
            # tree of symlinks into it. Mounting only /var/log gives Promtail
            # dangling links and an empty Grafana.
            - name: containerd
              mountPath: /var/lib/rancher/k3s/agent/containerd
              readOnly: true
            - name: positions
              mountPath: /run/promtail
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: containerd
          hostPath:
            path: /var/lib/rancher/k3s/agent/containerd
        - name: positions
          hostPath:
            path: /run/promtail
            type: DirectoryOrCreate
