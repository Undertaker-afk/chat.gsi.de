# Prometheus and Grafana.
#
# Mirrors the compose services, with the two differences k3s forces:
#
#   1. Config arrives as ConfigMaps, generated by `make -f k8s/Makefile.k8s
#      config` from deploy/prometheus/ and deploy/grafana/. Editing a file in
#      the repo does nothing until that target is re-run.
#   2. Grafana needs the same `hostAliases` block as the frontend. Its OAuth
#      redirect goes through the browser to keycloak.lab, and the token exchange
#      that follows goes from the POD to the same name -- the two have to be the
#      identical string or issuer validation fails. See AGENTS.md §5; this is the
#      same invariant, one more pod.
#
# There is exactly one scrape target (frontend:3000/metrics), because the
# frontend collects from Postgres, SeaweedFS, Valkey and Keycloak itself at
# scrape time. No exporter sidecars, no ServiceMonitors, no kube-prometheus.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: chat-gsi
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: chat-gsi
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: chat-gsi
spec:
  replicas: 1
  # ReadWriteOnce PVC: a RollingUpdate would deadlock waiting for a volume the
  # outgoing pod still holds. Same reason as the stateful Deployments in §6.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # Restarts the pod when the config changes, since Prometheus only
        # re-reads on SIGHUP and the Deployment spec is otherwise identical.
        checksum/config: from-configmap
    spec:
      securityContext:
        # The image runs as nobody; local-path provisions directories owned by
        # root, so without this the TSDB cannot be created and the pod
        # CrashLoopBackOffs with a bare "permission denied".
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: chat-gsi
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: chat-gsi
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: chat-gsi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472 # the grafana user in the official image
        runAsUser: 472
        runAsNonRoot: true
      # Same three names as the frontend, for the same reason: the browser and
      # this pod must resolve keycloak.lab to the identical URL string, or the
      # login page works and the token exchange fails.
      hostAliases:
        - ip: "192.168.50.119"
          hostnames:
            - keycloak.lab
            - grafana.lab
            - chat.lab
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.5.1
          env:
            - name: GF_SERVER_ROOT_URL
              value: http://grafana.lab
            - name: GF_SERVER_HTTP_PORT
              value: "3001"

            # --- llmbot-admin only --------------------------------------
            # ROLE_ATTRIBUTE_PATH maps the realm role to Grafana's Admin;
            # ROLE_ATTRIBUTE_STRICT rejects the login when it yields nothing.
            # Both are needed: without strict, an authenticated non-admin would
            # quietly receive the default org role and read every dashboard.
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: GSI Login
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: grafana
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-gsi-env
                  key: GRAFANA_OIDC_CLIENT_SECRET
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: openid email profile roles
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: http://keycloak.lab/realms/gsi/protocol/openid-connect/auth
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: http://keycloak.lab/realms/gsi/protocol/openid-connect/token
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: http://keycloak.lab/realms/gsi/protocol/openid-connect/userinfo
            - name: GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL
              value: http://keycloak.lab/realms/gsi/protocol/openid-connect/logout
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: contains(roles[*], 'llmbot-admin') && 'Admin'
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
              value: preferred_username
            - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
              value: name
            - name: GF_AUTH_OAUTH_AUTO_LOGIN
              value: "true"
            # RECOVERY: if Keycloak is broken and you need in, set this to
            # "false" and log in as admin with GRAFANA_ADMIN_PASSWORD.
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-gsi-env
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/overview.json
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: providers
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: chat-gsi
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
---
# Ad-hoc PromQL, when a dashboard panel is not enough. No auth in front of it,
# consistent with the rest of the lab subnet (AGENTS.md §1) -- note that this
# means the Prometheus UI is NOT llmbot-admin gated the way Grafana is.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: chat-gsi
spec:
  ingressClassName: traefik
  rules:
    - host: prometheus.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
